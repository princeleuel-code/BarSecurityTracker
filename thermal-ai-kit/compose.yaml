version: '3.8'

services:
  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"

  ingestion:
    build:
      context: ./src/ingestion
      dockerfile: Dockerfile
    environment:
      - ONNX_EXECUTOR=${ONNX_EXECUTOR:-CPUExecutionProvider}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis

  detectors:
    build:
      context: ./src/detectors
      dockerfile: Dockerfile
    environment:
      - ONNX_EXECUTOR=${ONNX_EXECUTOR:-CPUExecutionProvider}
      - Y8_MODEL_PATH=y8_thermal/weights/y8_thermal.onnx
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./src/detectors/y8_thermal/weights:/app/y8_thermal/weights
    depends_on:
      - redis

  postproc:
    build:
      context: ./src/postproc
      dockerfile: Dockerfile
    environment:
      - ONNX_EXECUTOR=${ONNX_EXECUTOR:-CPUExecutionProvider}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis

  api:
    build:
      context: ./src/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      # - ingestion # Direct dependencies might change with Redis
      # - detectors
      # - postproc
      - redis
    environment:
      - ONNX_EXECUTOR=${ONNX_EXECUTOR:-CPUExecutionProvider}
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - api

# volumes:
#   redis_data: # Example if persistence was added for Redis
#   model_weights: # This was an example, y8 model weights are mounted directly for now.
