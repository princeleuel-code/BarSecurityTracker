<!DOCTYPE html>
<html>
<head>
    <title>HLS Test</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        #video {
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            display: block;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        .status {
            margin: 20px 0;
            padding: 10px;
            background-color: #333;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>HLS Stream Test</h1>
        <video id="video" controls autoplay muted></video>
        <div class="status" id="status">Status: Initializing...</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const statusElement = document.getElementById('status');
        const hlsUrl = 'http://localhost:8888/cam1-hls/index.m3u8';

        function updateStatus(message) {
            statusElement.textContent = 'Status: ' + message;
        }

        if (Hls.isSupported()) {
            const hls = new Hls({
                debug: true,
                manifestLoadingMaxRetry: 5,
                manifestLoadingRetryDelay: 1000,
                levelLoadingMaxRetry: 5,
                levelLoadingRetryDelay: 1000
            });
            
            hls.on(Hls.Events.MEDIA_ATTACHED, function() {
                updateStatus('HLS.js attached to video element');
                console.log('HLS.js attached to video element');
            });
            
            hls.on(Hls.Events.MANIFEST_PARSED, function(event, data) {
                updateStatus('Manifest loaded, found ' + data.levels.length + ' quality level(s)');
                console.log('Manifest loaded, found ' + data.levels.length + ' quality level(s)');
                video.play();
            });
            
            hls.on(Hls.Events.ERROR, function(event, data) {
                console.error('HLS.js error:', data);
                if (data.fatal) {
                    updateStatus('Fatal error: ' + data.type + ' - ' + data.details);
                    switch(data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            console.log('Network error, trying to recover...');
                            hls.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            console.log('Media error, trying to recover...');
                            hls.recoverMediaError();
                            break;
                        default:
                            console.log('Unrecoverable error');
                            hls.destroy();
                            break;
                    }
                } else {
                    updateStatus('Non-fatal error: ' + data.type + ' - ' + data.details);
                }
            });
            
            hls.loadSource(hlsUrl);
            hls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Native HLS support (Safari)
            updateStatus('Using native HLS support');
            video.src = hlsUrl;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
            video.addEventListener('error', function(e) {
                updateStatus('Error loading video: ' + video.error.message);
                console.error('Error loading video:', video.error);
            });
        } else {
            updateStatus('HLS is not supported in this browser');
        }
    </script>
</body>
</html>
