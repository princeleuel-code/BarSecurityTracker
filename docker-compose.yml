services:
  # ───────────────────────────── Thermal detector (YOLOv11‑T) ───────────────────────────
  detector-thermal:
    build: ./detector-thermal
    environment:
      - RTSP_URL=${THERMAL_RTSP_URL}  # thermal camera stream
      - BARSHIELD_DEVICE=${BARSHIELD_DEVICE:-cpu}  # defaulting to CPU mode
    volumes:
      - ./weights:/opt/weights        # thermal weights
    restart: unless-stopped
    ports:
      - "8766:8766"                   # WebSocket alerts (thermal)

  # ─────────────────────────────── Fusion service ───────────────────────────────────────
  fusion:
    build: ./fusion
    depends_on: [detector-thermal]
    environment:
      - THERMAL_WS=ws://detector-thermal:8766
    ports:
      - "8770:8770"                   # Fused alerts WebSocket
    restart: unless-stopped

  # ───────────────────────────── Observability stack ────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana-oss:latest
    depends_on: [prometheus]
    ports:
      - "3000:3000"

  # ───────────────────────────── Dashboard UI ────────────────────────────────────
  dashboard:
    build: ./dashboard
    depends_on: [alertbus]
    ports:
      - "5173:80"
    restart: unless-stopped

  # ───────────────────────────── Alert Bus ────────────────────────────────────
  alertbus:
    build: ./alertbus
    depends_on: [fusion]
    environment:
      - FUSION_WS=ws://fusion:8770
    restart: unless-stopped

volumes:
  weights:
