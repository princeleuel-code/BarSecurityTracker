services:
  # ───────────────────────────── RGB detector (YOLOv8) ────────────────────────────────
  detector-rgb:
    build: ./detector-rgb
    environment:
      - RTSP_URL=${RTSP_URL:?RTSP_URL is required}
      - BARSHIELD_DEVICE=${BARSHIELD_DEVICE:-cpu}
      - GUN_MODEL_PATH=/models/gun_yolov8n.pt
    volumes:
      - ./models:/models:ro
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"

  # ───────────────────────────── Thermal detector (YOLOv11‑T) ───────────────────────────
  detector-thermal:
    build: ./detector-thermal
    environment:
      - RTSP_URL=${THERMAL_RTSP_URL:?THERMAL_RTSP_URL is required}
      - BARSHIELD_DEVICE=cpu
    volumes:
      - ./weights:/opt/weights
    restart: unless-stopped
    ports:
      - "127.0.0.1:8766:8766"

  # ───────────────────────────── Thermal Gun detector ───────────────────────────
  detector-gun:
    build: ./detector-thermal
    environment:
      - RTSP_URL=${THERMAL_RTSP_URL:?THERMAL_RTSP_URL is required}
      - BARSHIELD_DEVICE=${BARSHIELD_DEVICE:-cpu}
    volumes:
      - ./weights:/opt/weights
    restart: unless-stopped
    ports:
      - "127.0.0.1:9106:9106"
    command: ["python", "gun_detector.py"]

  # ───────────────────────────── Fight/Fall detector (MoveNet) ───────────────────────────
  detector-ffd:
    build: ./detector-ffd
    environment:
      - RTSP_URL=${RTSP_URL:?RTSP_URL is required}
      - BARSHIELD_DEVICE=${BARSHIELD_DEVICE:-cpu}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8767:8767"
      - "127.0.0.1:9105:9105"

  # ─────────────────────────────── Fusion service ───────────────────────────────────────
  fusion:
    build: ./fusion
    depends_on: [detector-thermal, detector-rgb, detector-ffd, detector-gun]
    environment:
      - THERMAL_WS=ws://detector-thermal:8766
      - RGB_WS=ws://detector-rgb:8765
      - FFD_WS=ws://detector-ffd:8767
      - GUN_WS=ws://detector-gun:9106
    ports:
      - "127.0.0.1:8770:8770"
    restart: unless-stopped

  # ───────────────────────────── Observability stack ────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana-oss:latest
    depends_on: [prometheus]
    ports:
      - "127.0.0.1:3000:3000"

  # ───────────────────────────── Dashboard UI ────────────────────────────────────
  dashboard:
    build: ./dashboard
    depends_on: [alertbus]
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped

  # ───────────────────────────── Alert Bus ────────────────────────────────────
  alertbus:
    build: ./alertbus
    depends_on: [fusion]
    environment:
      - FUSION_WS=ws://fusion:8770
    restart: unless-stopped

volumes:
  weights:
